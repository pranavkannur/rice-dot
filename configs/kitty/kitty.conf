# Kitty Terminal Configuration
# Caelestia-dots inspired minimal aesthetic

# -----------------------------------------------------------------------------
# Font Configuration
# -----------------------------------------------------------------------------
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0

# Adjust line height and cell height for better readability
adjust_line_height  110%
adjust_column_width 100%

# -----------------------------------------------------------------------------
# Window Layout & UI
# -----------------------------------------------------------------------------
# Hide window decorations (title bar, etc.)
hide_window_decorations yes

# Window padding (in pixels)
window_padding_width 10

# Background opacity and blur
background_opacity 0.92
background_blur 20

# Disable confirmation when closing the terminal
confirm_os_window_close 0

# -----------------------------------------------------------------------------
# Cursor & Scrollback
# -----------------------------------------------------------------------------
# Cursor style (block, beam, underline)
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback history
scrollback_lines 10000

# -----------------------------------------------------------------------------
# Mouse & URLs
# -----------------------------------------------------------------------------
# URL detection and clicking
url_style curly
open_url_with default
detect_urls yes

# -----------------------------------------------------------------------------
# Advanced
# -----------------------------------------------------------------------------
# Shell integration
shell zsh

# Allow remote control (for live color reloading with scripts like matugen)
allow_remote_control yes

# Unix socket for remote control
listen_on unix:/tmp/kitty-socket

# -----------------------------------------------------------------------------
# Tab Bar
# -----------------------------------------------------------------------------
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# -----------------------------------------------------------------------------
# Keybindings
# -----------------------------------------------------------------------------
# Copy/Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Font size adjustments
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# -----------------------------------------------------------------------------
# Colors (Includes)
# -----------------------------------------------------------------------------
# Include the dynamic color scheme
include colors.conf
