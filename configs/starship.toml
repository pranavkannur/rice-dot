# Starship Prompt Configuration
# Minimal, clean aesthetic

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold lavender)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold lavender"
read_only = " "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold maroon"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "yellow"
format = "[$duration]($style)"

# Disable noisy / irrelevant modules
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[docker_context]
disabled = true
[kubernetes]
disabled = true
[terraform]
disabled = true
[vagrant]
disabled = true
[nix_shell]
disabled = true
[package]
disabled = true

