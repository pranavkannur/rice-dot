# ===== User-Configurable Variables =====
# These values are managed by the Settings Menu (SUPER + S)
# and can also be edited manually.

# Window decoration
$active_opacity = 1.0
$inactive_opacity = 0.92
$fullscreen_opacity = 1.0

# Blur settings
$blur_enabled = true
$blur_size = 8
$blur_passes = 2
$blur_noise = 0.02

# Gaps & borders
$gaps_in = 4
$gaps_out = 8
$border_size = 1
$rounding = 10

# Shadows
$shadow_enabled = true
$shadow_range = 15
$shadow_render_power = 3

# Animation speed multiplier (1.0 = balanced, 0.5 = fast, 1.5 = smooth, 0 = off)
$anim_speed = 1.0
