# ==============================================================================
# HYPRLAND CONFIGURATION
# ==============================================================================
# Caelestia-dots inspired, minimal Material You styling.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SOURCE FILES
# ------------------------------------------------------------------------------
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/hypr-vars.conf
source = ~/.config/hypr/colors.conf

# ------------------------------------------------------------------------------
# 2. ENVIRONMENT VARIABLES
# ------------------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = PATH,$HOME/.local/bin:$HOME/rice_dot/scripts:$PATH

# ------------------------------------------------------------------------------
# 3. AUTOSTART (exec-once)
# ------------------------------------------------------------------------------
exec-once = waybar
exec-once = swaync
exec-once = swww-daemon
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle

# ------------------------------------------------------------------------------
# 4. INPUT & TOUCHPAD SETTINGS
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
    sensitivity = 0
}

# Touchpad Gestures (Hyprland v0.51+)
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace
gesture = 3, up, fullscreen
gesture = 3, down, float

# ------------------------------------------------------------------------------
# 5. GENERAL SETTINGS
# ------------------------------------------------------------------------------
general {
    gaps_in = $gaps_in
    gaps_out = $gaps_out
    border_size = $border_size
    col.active_border = $primary $primary_container 45deg
    col.inactive_border = $surface
    layout = dwindle
}

# ------------------------------------------------------------------------------
# 6. DECORATION
# ------------------------------------------------------------------------------
decoration {
    rounding = $rounding
    active_opacity = $active_opacity
    inactive_opacity = $inactive_opacity
    fullscreen_opacity = $fullscreen_opacity

    blur {
        enabled = $blur_enabled
        size = $blur_size
        passes = $blur_passes
        noise = $blur_noise
    }

    shadow {
        enabled = $shadow_enabled
        range = $shadow_range
        render_power = $shadow_render_power
        color = rgba(1a1a1aee)
    }
}

# ------------------------------------------------------------------------------
# 7. ANIMATIONS
# ------------------------------------------------------------------------------
animations {
    enabled = $anim_enabled
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, $anim_speed, myBezier
    animation = windowsOut, 1, $anim_speed, smoothOut, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, $anim_speed, smoothIn
    animation = workspaces, 1, $anim_speed, default
}

# ------------------------------------------------------------------------------
# 8. DWINDLE LAYOUT
# ------------------------------------------------------------------------------
dwindle {
    preserve_split = true
}

# ------------------------------------------------------------------------------
# 9. MISC
# ------------------------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ------------------------------------------------------------------------------
# 10. WINDOW RULES
# ------------------------------------------------------------------------------
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(file-roller)$
windowrule = float 1, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = float 1, match:title ^(File Operation)$

windowrule = opacity $active_opacity $inactive_opacity, match:class ^(kitty)$

windowrule = float 1, match:class ^(float-.*)$
windowrule = size 80% 80%, match:class ^(float-.*)$
windowrule = center 1, match:class ^(float-.*)$

# Scratchpad terminal rules
windowrule = workspace special:scratchpad, match:class ^(scratchpad)$
windowrule = float 1, match:class ^(scratchpad)$
windowrule = size 75% 55%, match:class ^(scratchpad)$
windowrule = move 12.5% 40, match:class ^(scratchpad)$

# ------------------------------------------------------------------------------
# 11. WORKSPACE RULES
# ------------------------------------------------------------------------------
windowrule = workspace 5, match:class ^(vesktop)$
windowrule = workspace 5, match:class ^(discord)$
windowrule = workspace 6, match:class ^(Spotify)$

# ------------------------------------------------------------------------------
# 12. KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Core bindings
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, nautilus

# Application launcher (toggle with Super key alone, or Super + Space / Super + D)
bindr = SUPER, SUPER_L, exec, pkill -x rofi || rofi -show drun
bindr = SUPER, SUPER_R, exec, pkill -x rofi || rofi -show drun
bind = $mainMod, Space, exec, pkill -x rofi || rofi -show drun
bind = $mainMod, D, exec, pkill -x rofi || rofi -show drun
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, Escape, exec, powermenu.sh
bind = $mainMod, T, exec, theme-toggle.sh
bind = $mainMod, S, exec, settings-menu.sh
bind = $mainMod, P, exec, project-launcher.sh
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, L, exec, hyprlock

# Floating terminal utilities
bind = $mainMod, G, exec, kitty --class float-lazygit lazygit
bind = $mainMod, M, exec, kitty --class float-btop btop

# Scratchpad
bind = $mainMod, grave, togglespecialworkspace, scratchpad
bind = $mainMod, grave, exec, hyprctl clients | grep -q "class: scratchpad" || kitty --class scratchpad

# Utilities
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = , Print, exec, screenshot.sh
bind = $mainMod SHIFT, S, exec, screenshot.sh

# Window focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media & Volume Keys (with visual OSD)
bindel = , XF86AudioRaiseVolume, exec, volume-control.sh volume-up
bindel = , XF86AudioLowerVolume, exec, volume-control.sh volume-down
bindl = , XF86AudioMute, exec, volume-control.sh mute-toggle
bindl = , XF86AudioMicMute, exec, volume-control.sh mic-mute-toggle
bindl = $mainMod ALT, M, exec, volume-control.sh mic-mute-toggle
bindel = $mainMod SHIFT, Up, exec, volume-control.sh mic-up
bindel = $mainMod SHIFT, Down, exec, volume-control.sh mic-down

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
