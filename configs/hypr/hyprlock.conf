# ==============================================================================
# HYPRLOCK CONFIGURATION
# ==============================================================================
# Colors matching Catppuccin Mocha
# ==============================================================================

background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------------------------
# CLOCK
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# DATE
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(186, 194, 222, 1.0)
    font_size = 30
    font_family = JetBrains Mono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# INPUT FIELD
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(203, 166, 247, 1.0)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = true
    font_family = JetBrains Mono Nerd Font
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
